# Development overrides — auto-loaded by `docker compose up`
# Skipped when explicit -f flags are used (e.g., production)

services:
  api:
    read_only: false  # Dev needs write for __pycache__, .pyc (hot-reload)
    volumes:
      - ./backend:/app  # Hot-reload: code changes without rebuild
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000 --reload
