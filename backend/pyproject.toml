[project]
name = "hydrograf"
version = "0.5.0.dev0"
description = "Web application for watershed delineation, catchment parameters and design hydrographs in Poland (FastAPI, PostGIS)."
readme = {text = "Hydrological analysis system", content-type = "text/plain"}
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [
    {name = "Hydrograf Team"}
]
keywords = ["hydrology", "watershed", "hydrograph", "GIS", "SCS-CN"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: GIS",
    "Topic :: Scientific/Engineering :: Hydrology",
]

dependencies = [
    # FastAPI and server
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "python-multipart>=0.0.6",
    # Database. SQLAlchemy 2.1 selects the psycopg v3 driver for `postgresql://` URLs
    # while the image ships psycopg2-binary: the rebuilt image looped on
    # `alembic upgrade head` (2026-10-08). Lift the cap together with the URLs.
    "sqlalchemy>=2.0.25,<2.1",
    "psycopg2-binary>=2.9.9",
    "geoalchemy2>=0.14.3",
    "alembic>=1.13.1",
    # Validation and settings
    "pydantic>=2.5.3",
    "pydantic-settings>=2.1.0",
    "pyyaml>=6.0",
    # Geospatial
    "shapely>=2.0.2",
    "pyproj>=3.6.1",
    "geojson>=3.1.0",
    "geopandas>=0.14.2",
    "fiona>=1.9.5",
    "pandas>=2.0",
    # Scientific computing
    "numpy>=1.26.3",
    "scipy>=1.12.0",
    "numba>=0.58",
    # DEM processing
    "pyflwdir>=0.5.8",
    "rasterio>=1.3.9",
    "Pillow>=10.0.0",
    # affine 3.x is an attrs class, not a namedtuple, and pyflwdir passes the transform
    # to a numba function (`Cannot determine Numba type of affine.Affine`, 2026-10-18;
    # Deltares/pyflwdir#108, fixed on its main branch, not released). Lift the cap with
    # the release of pyflwdir.
    "affine>=2.4,<3",
    # Ecosystem producers, pinned until the first release set (REL-5.1): precipitation
    # PMAXTP of IMGWTools, spatial data download of Kartograf (NMT, BDOT10k, CORINE,
    # SoilGrids) and the calculations of Hydrolog. Kartograf stays on its release tag: its
    # data output is not migrated yet (docs/PROGRESS.md, Next 2). IMGWTools and Hydrolog
    # are pinned by commit while their tags do not exist (REL-5.3, DEV-3.4): the head of
    # IMGWTools `feature/data-output` and the head of Hydrolog `feature/routing-network`.
    # Neither commit is pushed, so `uv lock` and `uv sync` resolve them only on a machine
    # whose uv git cache holds them (docs/PROGRESS.md, Next 2). The release pull request
    # replaces both commits with tags (REL-5.3).
    "imgwtools @ git+https://github.com/Daldek/IMGWTools.git@a30452182b01f47cc18e48466da4edf4d0c8cb6a",
    "kartograf @ git+https://github.com/Daldek/Kartograf.git@v0.7.0",
    "hydrolog @ git+https://github.com/Daldek/Hydrolog.git@6c9ba5afae65c601c447f48f5c1412e93f3a1d60",
    "requests>=2.31",
    # Logging, process monitoring, utilities, caching
    "structlog>=24.1.0",
    "psutil>=5.9",
    "python-dotenv>=1.0.0",
    "cachetools>=5.3.0",
]

[project.optional-dependencies]
# Figures of scripts/analyze_watershed.py (not needed by the API or the pipeline).
viz = ["matplotlib>=3.8"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.23.3",
    "httpx>=0.26.0",
    "ruff>=0.8",
    "mypy>=1.13",
    "pytest-benchmark>=4.0",
]

[project.urls]
Repository = "https://github.com/Daldek/Hydrograf"

[tool.uv]
# An application: uv installs the dependencies, not the code (Docker copies it, the
# tests and scripts import it from this directory).
package = false

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4", "D"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.per-file-ignores]
"api/endpoints/*.py" = ["B008"]
# DEV-7.2: tests may skip the docstring rules.
"tests/**" = ["D"]
# DEV-7.2 deviation: the migrations hold DDL strings that stay on one line.
"migrations/versions/*" = ["E501"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
strict = true
files = ["api", "core", "models", "scripts", "utils", "tests"]
exclude = ["migrations"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
# Third-party packages without type information: no py.typed marker, and the stub
# packages are not in the lock.
module = [
    "affine",
    "fiona",
    "fiona.*",
    "geopandas",
    "pandas",
    "psutil",
    "pyflwdir",
    "pyflwdir.*",
    "rasterio",
    "rasterio.*",
    "scipy",
    "scipy.*",
    "shapely",
    "shapely.*",
    "yaml",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# Ecosystem producers that ship no py.typed marker: IMGWTools at the pinned commit declares
# `Typing :: Typed` but ships no marker, and Kartograf `v0.7.0` predates DEV-7.4. Hydrolog
# ships `py.typed`, so mypy checks the calls against its types (no override). Drop a
# producer from this list when its release ships the marker.
module = [
    "imgwtools",
    "imgwtools.*",
    "kartograf",
    "kartograf.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# DEV-7.3 deviation: the tests carry no annotations (about 1,260 functions), so mypy
# does not check the bodies of the untyped ones. Annotate a test file and drop it
# from this list to have it checked.
module = ["tests", "tests.*"]
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_calls = false
check_untyped_defs = false

[[tool.mypy.overrides]]
# DEV-7.3 deviation: the command line scripts are partly unannotated (46 findings of
# untyped definitions and calls); their annotated code is checked in full.
module = ["scripts", "scripts.*"]
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_calls = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
python_files = ["test_*.py"]
python_functions = ["test_*"]
asyncio_mode = "auto"
# DEV-10.1: the default run leaves out `live` and, because there is no database on a
# development machine, `db`; `benchmark` is the project's own marker for the timing
# tests of tests/performance.
addopts = "--strict-markers --tb=short -m 'not live and not db and not benchmark'"
markers = [
    "live: real network services",
    "db: needs a PostGIS database",
    "slow: more than ~10 s or Docker",
    "benchmark: timing measurements of tests/performance",
]

[tool.coverage.run]
source = ["."]
omit = [
    ".venv/*",
    "tests/*",
    "migrations/*",
    "scripts/*",
]

[tool.coverage.report]
# DEV-7.5: the floor of the standard. The offline suite covers 85% of the statements of
# api, core, models and utils; the SQL over PostGIS that is left runs in the `db` job.
fail_under = 80
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
