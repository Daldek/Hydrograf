# Dependency updates (DEV-13.6), template from Nogat standards/ci/dependabot.yml,
# extended by the images of the server (Nogat install contract, rules 9 and 13):
# weekly, grouped pull requests into develop with Conventional Commit messages that
# the gate accepts.
# Python vulnerabilities: enable "Dependabot security updates" in the
# repository settings (Code security). Third-party versions otherwise change
# with release sets (REL §6), so there is no uv entry.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: ci
      include: scope
  # The base image of the API.
  - package-ecosystem: docker
    directory: /backend
    target-branch: develop
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
      include: scope
  # nginx and PostGIS of the compose file.
  - package-ecosystem: docker-compose
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
      include: scope
