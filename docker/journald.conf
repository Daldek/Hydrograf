# The retention of the logs of nginx and the API (Nogat DEV-15.10, ADR-084), which
# docker-compose.yml sends to the host's journal (logging driver journald). Install as
# root on the Docker host, then restart the journal:
#
#   install -m 644 docker/journald.conf /etc/systemd/journald.conf.d/hydrograf.conf
#   systemctl restart systemd-journald
#
# journald keeps a whole file of the journal until its newest entry is older than
# MaxRetentionSec, and checks it when it starts the next file. With a file a day, an
# entry is gone at the latest 12 + 1 + 1 days after it was written: 14 days. The
# setting holds for the whole journal of the host, not only for Hydrograf's containers.
[Journal]
MaxRetentionSec=12day
MaxFileSec=1day
