events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logs without the client's address (Nogat DEV-15.10, ADR-084). An access line holds
    # the time, the method, the path with its query, the status, the size, the durations,
    # the request ID and the User-Agent; no $remote_addr, $remote_user or $http_referer.
    # nginx names the client in every error of a request, so the error log takes `crit`
    # and worse only (limit_req and limit_conn would log at `error`, below it). Behind the
    # Cloudflare Tunnel nginx's peer is the tunnel's connector anyway: the client's
    # address reaches the API in CF-Connecting-IP, which nginx neither reads nor logs.
    # Docker keeps both logs 14 days (journald, docker-compose.yml).
    log_format hydrograf '$time_iso8601 "$request_method $request_uri" $status '
                         '$body_bytes_sent request_time=$request_time '
                         'upstream_time=$upstream_response_time request_id=$request_id '
                         '"$http_user_agent"';
    access_log /dev/stdout hydrograf;
    error_log /dev/stderr crit;

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/geo+json application/javascript text/xml application/xml application/x-protobuf;

    # No limit here: the API limits pages and routes per client address and counts them
    # (api/traffic.py, DEV-15.9, DEV-15.11); nginx's peer is the same for every client
    # behind the tunnel. X-Real-IP tells the API that peer, so that it believes the
    # client's address of CF-Connecting-IP only from a private hop.

    upstream api_backend {
        server api:8000;
    }

    server {
        listen 80;
        server_name localhost;

        # nginx w kontenerze nasluchuje na porcie 80 i nie zna zewnetrznego
        # portu z mapowania Dockera (np. 8080:80 w docker-compose.yml). Przy
        # domyslnym absolute_redirect on wszystkie przekierowania (np. redirect
        # katalogowy /data -> /data/) budowalyby bezwzgledny URL z $host
        # i portem nasluchu (80), gubiac faktyczny port klienta — dzialalo to
        # przypadkiem za tunelem Cloudflare, bo tam 443 jest portem domyslnym
        # dla https i znika z adresu, ale psulo sie na LAN z jawnym portem
        # 8080. Wzgledny Location (bez hosta/portu) dziala poprawnie zawsze,
        # bo przegladarka doklei biezacy origin sama.
        absolute_redirect off;

        # Security headers
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://unpkg.com https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://unpkg.com https://cdn.jsdelivr.net; img-src 'self' data: blob: https://mapy.geoportal.gov.pl https://server.arcgisonline.com https://wody.isok.gov.pl; font-src 'self' https://cdn.jsdelivr.net; connect-src 'self' https://tiles.openfreemap.org; worker-src blob:; child-src blob:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
        # HSTS only meaningful over HTTPS — see nginx-ssl.conf.template for TLS config

        # Tile proxy (^~ prevents the regex .pbf match of the data files below)
        location ^~ /api/tiles/ {
            proxy_pass http://api_backend/api/tiles/;
            proxy_set_header Host $host;
            proxy_set_header X-Request-ID $request_id;
            proxy_set_header X-Real-IP $remote_addr;

            proxy_read_timeout 15s;
        }

        # Own code and styles. Pages reference them as `?v=<content hash>`
        # (scripts/bump_asset_versions.py), so a changed file gets a new URL
        # and bypasses browser and Cloudflare caches regardless of this TTL.
        location ~* \.(css|js|ico|svg)$ {
            root /usr/share/nginx/html;
            expires 1h;
            add_header Cache-Control "public, must-revalidate";
            add_header X-Content-Type-Options "nosniff" always;
        }

        # HTML pages (/, /admin, /instrukcja/ and the SPA fallback reach this via an
        # internal redirect to *.html) pass through the API, which limits and counts
        # them (ADR-084): it answers with X-Accel-Redirect to the page's file under
        # /_site/, with the filled regulamin, or with 429. While the API is down or
        # starting, nginx sends the page's file itself.
        location ~* \.html$ {
            proxy_pass http://api_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Request-ID $request_id;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_read_timeout 30s;
            error_page 502 504 = @page_file;
        }

        # The page files the API names (X-Accel-Redirect), always revalidated (ETag),
        # so a deploy's new asset URLs reach the browser on the next load. `expires`
        # instead of add_header keeps the server-level security headers (CSP) inherited.
        location ^~ /_site/ {
            internal;
            alias /usr/share/nginx/html/;
            expires -1;
        }
        location @page_file {
            root /usr/share/nginx/html;
            expires -1;
        }

        # Pipeline-generated data (tiles, overlays, geojson) — no browser cache
        # to avoid stale data after pipeline re-run
        location ~* \.(pbf|geojson|mbtiles|pmtiles)$ {
            root /usr/share/nginx/html;
            expires -1;
            add_header Cache-Control "no-store, no-cache, must-revalidate";
            add_header X-Content-Type-Options "nosniff" always;
        }
        location ^~ /data/ {
            root /usr/share/nginx/html;
            expires -1;
            add_header Cache-Control "no-store, no-cache, must-revalidate";
            add_header X-Content-Type-Options "nosniff" always;
        }
        location ^~ /tiles/ {
            root /usr/share/nginx/html;
            expires -1;
            add_header Cache-Control "no-store, no-cache, must-revalidate";
            add_header X-Content-Type-Options "nosniff" always;
        }

        # Admin panel (Cloudflare Access in front of it, with /api/admin/)
        location = /admin {
            rewrite ^ /admin.html last;
        }

        # Admin API
        location /api/admin/ {
            client_max_body_size 50m;

            proxy_pass http://api_backend/api/admin/;
            proxy_set_header Host $host;
            proxy_set_header X-Request-ID $request_id;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_read_timeout 30s;
        }

        # Frontend - static files
        location / {
            root /usr/share/nginx/html;
            index index.html;
            try_files $uri $uri/ /index.html;
        }

        # Admin SSE stream (longer timeout for bootstrap)
        location = /api/admin/bootstrap/stream {
            proxy_pass http://api_backend/api/admin/bootstrap/stream;
            proxy_set_header X-Request-ID $request_id;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Admin-Key $http_x_admin_key;
            proxy_read_timeout 3600s;
            proxy_buffering off;
        }

        # API proxy
        location /api/ {
            proxy_pass http://api_backend/api/;
            proxy_set_header X-Request-ID $request_id;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Timeouts
            proxy_connect_timeout 30s;
            proxy_send_timeout 30s;
            proxy_read_timeout 120s;
        }

        # Health check endpoint
        location /health {
            proxy_pass http://api_backend/health;
            proxy_set_header X-Request-ID $request_id;
            proxy_set_header Host $host;
        }
    }
}
